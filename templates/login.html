<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Iniciar Sesión - Medidor</title>
    <style>
        :root { 
            --primary: #2563eb; 
            --background: #f8fafc; 
            --card: #ffffff; 
            --text: #1e293b; 
            --border: #cbd5e1; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--background); 
            color: var(--text); 
            padding: 16px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .card { background: var(--card); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); width: 100%; max-width: 350px; }
        h2 { margin-bottom: 20px; color: #0f172a; text-align: center; font-size: 22px; }
        .form-group { margin-bottom: 18px; display: flex; flex-direction: column; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #475569; }
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 16px; 
        }
        .alert-danger {
            background-color: #fee2e2; color: #991b1b; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; text-align: center;
        }
        button { width: 100%; padding: 14px; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; background-color: var(--primary); color: white; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Control de Medidor</h2>
        
        {% if error %}
        <div class="alert-danger">{{ error }}</div>
        {% endif %}
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" required placeholder="Ingresa tu usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required placeholder="••••••••">
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
