<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>⚡ Iniciar Sesión</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            width: 100%;
            max-width: 320px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; color: #1e293b; font-size: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .form-group { margin-bottom: 16px; text-align: left; }
        label { display: block; margin-bottom: 6px; font-weight: 500; font-size: 14px; color: #475569; }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }
        input:focus { outline: 2px solid #2563eb; }
        button {
            width: 100%;
            padding: 14px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
        }
        button:hover { background-color: #1d4ed8; }
        .error { color: #dc2626; font-size: 14px; margin-bottom: 12px; font-weight: 500; background-color: #fee2e2; padding: 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Acceso Privado</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="password">Contraseña de Seguridad</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu clave" required>
            </div>
            <button type="submit">Ingresar</button>
        </form>
    </div>
</body>
</html>
