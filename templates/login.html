<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔒 Acceso Privado</title>
    <style>
        /* ☀️ CONFIGURACIÓN POR DEFECTO (MODO CLARO) */
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-label: #475569;
            --bg-input: #ffffff;
            --border-input: #cbd5e1;
            --text-input: #0f172a;
            --btn-color: #0b4bc4;
            --btn-hover: #1d4ed8;
            --border-card: #cbd5e1;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        /* 🌙 TRADUCCIÓN AUTOMÁTICA SI EL TELÉFONO ESTÁ EN MODO OSCURO */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-body: #121212;
                --bg-card: #1e1e1e;
                --text-main: #ffffff;
                --text-label: #aeaeae;
                --bg-input: #2a2a2a;
                --border-input: #3d3d3d;
                --text-input: #ffffff;
                --btn-color: #0b4bc4;
                --btn-hover: #1d4ed8;
                --border-card: #2d2d2d;
                --error-bg: #7f1d1d;
                --error-text: #fca5a5;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 16px;
            transition: background-color 0.2s, color 0.2s;
        }
        
        .login-card {
            background-color: var(--bg-card);
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid var(--border-card);
            transition: background-color 0.2s, border-color 0.2s;
        }
        
        h2 { 
            color: var(--text-main);
            margin-bottom: 28px; 
            font-size: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            font-weight: 600;
        }
        
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: var(--text-label); 
            font-weight: 500;
        }
        
        input {
            width: 100%;
            padding: 14px;
            background-color: var(--bg-input);
            border: 1px solid var(--border-input);
            border-radius: 8px;
            font-size: 16px;
            color: var(--text-input);
            box-sizing: border-box;
            transition: background-color 0.2s, border-color 0.2s, color 0.2s;
        }
        
        input::placeholder {
            color: #94a3b8;
        }
        
        input:focus { 
            outline: none;
            border-color: var(--btn-hover); 
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: var(--btn-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }
        
        button:hover { 
            background-color: var(--btn-hover); 
        }
        
        .error { 
            color: var(--error-text); 
            font-size: 14px; 
            margin-bottom: 16px; 
            font-weight: 500; 
            background-color: var(--error-bg); 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Acceso Privado</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ej: admin" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
