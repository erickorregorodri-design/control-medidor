<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🔒 Acceso Privado</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .login-card {
            background-color: #1e1e1e;
            padding: 32px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 340px;
            text-align: center;
            border: 1px solid #2d2d2d;
        }
        h2 { 
            color: #ffffff; 
            margin-bottom: 28px; 
            font-size: 24px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 10px;
            font-weight: 600;
        }
        .form-group { 
            margin-bottom: 20px; 
            text-align: left; 
        }
        label { 
            display: block; 
            margin-bottom: 8px; 
            font-size: 14px; 
            color: #aeaeae; 
            font-weight: 500;
        }
        input {
            width: 100%;
            padding: 14px;
            background-color: #2a2a2a;
            border: 1px solid #3d3d3d;
            border-radius: 8px;
            font-size: 16px;
            color: #ffffff;
            box-sizing: border-box;
        }
        input::placeholder {
            color: #666666;
        }
        input:focus { 
            outline: none;
            border-color: #2563eb; 
        }
        button {
            width: 100%;
            padding: 14px;
            background-color: #0b4bc4;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { 
            background-color: #1d4ed8; 
        }
        .error { 
            color: #fca5a5; 
            font-size: 14px; 
            margin-bottom: 16px; 
            font-weight: 500; 
            background-color: #7f1d1d; 
            padding: 10px; 
            border-radius: 6px; 
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>🔒 Acceso Privado</h2>
        
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Ej: admin" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit">Ingresar al Sistema</button>
        </form>
    </div>
</body>
</html>
